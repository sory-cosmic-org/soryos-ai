[workspace]
members = ["crates/*", "apps/*"]
resolver = "2"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
thiserror = { version = "2" }
anyhow = { version = "1" }
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls-native-roots"] }
futures = { version = "0.3" }
async-trait = { version = "0.1" }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.32", features = ["bundled"] }
toml = { version = "0.8" }
bytes = { version = "1" }
assistant-core = { path = "crates/assistant-core" }
ai-providers = { path = "crates/ai-providers" }
soryos-voice = { path = "crates/voice" }
soryos-tools = { path = "crates/soryos-tools" }
soryos-security = { path = "crates/soryos-security" }
soryos-storage = { path = "crates/soryos-storage" }
soryos-ui = { path = "crates/soryos-ui" }

[profile.dev]
debug = 1
